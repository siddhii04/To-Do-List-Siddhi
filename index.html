<!DOCTYPE html>
<html>
<head>
    <title>My To Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 220px;
        }

        button {
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            text-align: left;
            margin: 10px;
            padding: 8px;
        }

        .delete {
            background-color: red;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To Do List</h1>
        <p>Manage your daily tasks easily!</p>

        <input type="text" id="task" placeholder="Enter a task">

        <button onclick="addTask()">Add Task</button>

        <h3>My Tasks</h3>

        <ul id="list"></ul>

    </div>

    <script>

        function addTask() {

            var task = document.getElementById("task").value;

            if (task == "") {
                alert("Please enter a task");
            }
            else {

                var li = document.createElement("li");

                li.innerHTML = task +
                ' <button class="delete" onclick="this.parentElement.remove()">Delete</button>';

                document.getElementById("list").appendChild(li);

                document.getElementById("task").value = "";
            }
        }

    </script>

</body>
</html>
